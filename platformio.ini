[platformio]
default_envs = firebeetle

; Flags shared by every firmware env.
[common]
build_flags = -DCORE_DEBUG_LEVEL=2

[env:firebeetle]
platform = espressif32 @ ^8.0.0
board = esp32dev
framework = arduino
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
monitor_speed = 115200
; Board revision (ticket #49, include/pins.h): without HANDRAD_BOARD_REV the soft power board (rev 2) is built.
build_flags =
  ${common.build_flags}
lib_deps =
  olikraus/U8g2 @ ^2.36.18

; Same firmware, flashed over WiFi with espota (SPEC 9.5, ticket #35). Needs the setting
; "Update über WLAN erlauben" and no axis selected. Password = Handrad-Passwort (ap_pass), only from the
; environment, never in the repo:  HANDRAD_OTA_PASS=<passwort> pio run -e firebeetle-ota -t upload
[env:firebeetle-ota]
extends = env:firebeetle
upload_protocol = espota
upload_port = handrad.local
upload_flags =
  --port=3232
  --auth=${sysenv.HANDRAD_OTA_PASS}


[env:native]
platform = native
test_framework = unity
build_flags = -std=c++17
lib_compat_mode = off
